name: Screenshots

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect after generation'
        required: false
        default: false
        type: boolean
      languages:
        description: 'Languages filter (space-separated, e.g. "en-US uk"). Empty = all from fastlane/metadata'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Screenshots (iOS + macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: true
      FASTLANE_SKIP_UPDATE_CHECK: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4.2.4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: |
          mise run setup

      - name: Select Xcode
        env:
          XCODE_VERSION: "26.3"
        run: |
          APPLICATIONS_FOLDER="/Applications"
          TARGET="${APPLICATIONS_FOLDER}/Xcode_${XCODE_VERSION}.app"
          if [ -d "$TARGET" ]; then
            sudo xcode-select -s "$TARGET"
          fi
          xcode-select -p
          xcodebuild -version
          # Ensure Simulator runtimes are available
          xcrun simctl list devices | head -n 30 || true

      - name: Prepare Project
        run: |
          rm -fr *.xcodeproj || true
          rm -fr *.xcworkspace || true
          mise run install
          mise run generate

      - name: Generate Screenshots
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if [ -n "$LANGUAGES" ]; then
            echo "Using languages filter: $LANGUAGES"
            export LANGUAGES
          else
            echo "Using all languages from fastlane/metadata"
          fi
          # mise task screenshots = iOS + macOS
          mise run screenshots

      - name: List Screenshots
        if: always()
        run: |
          du -sh fastlane/screenshots || true
          find fastlane/screenshots -type f | head -n 100 || true

      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            fastlane/screenshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Test Output (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-test-output-${{ github.run_number }}
          path: |
            fastlane/test_output/**
            ~/Library/Caches/tools.fastlane/screenshots/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to App Store Connect
        if: ${{ inputs.upload == true }}
        run: |
          CONFIG_PATH="$RUNNER_TEMP/fastlane.json"
          echo "${{ secrets.FASTLANE_CONFIG_JSON_BASE64 }}" | base64 --decode > "$CONFIG_PATH"
          mkdir -p fastlane
          cp "$CONFIG_PATH" fastlane/apikey.json
          echo "Starting upload..."
          source PiperApp/BuildScripts/Configs/version.xcconfig
          echo "Version $MARKETING_VERSION"
          mise run screenshots-upload
        env:
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}

      - name: Clean up keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fastlane.json" fastlane/apikey.json || true

