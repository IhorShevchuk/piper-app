name: Build
on:
  push:
    branches: ['main']
    paths:
      - 'PiperApp/**'
      - 'PiperAppUtils/**'
      - 'PiperappUtils/**'
      - 'PiperTTS/**'
      - 'PiperTTSLogic/**'
      - 'PiperTests/**'
      - 'Project.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '.mise.toml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-shared.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'PiperApp/**'
      - 'PiperAppUtils/**'
      - 'PiperappUtils/**'
      - 'PiperTTS/**'
      - 'PiperTTSLogic/**'
      - 'PiperTests/**'
      - 'Project.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '.mise.toml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-shared.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  Build:
    strategy:
      matrix:
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["ios-simulator"]') || fromJSON('["ios-device", "macos-device"]') }}

    uses: ./.github/workflows/build-shared.yml
    with:
      platform: ${{ matrix.platform }}
    secrets: inherit

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4.2.4
        with:
          install: false
          cache: true
      - name: Install lint tool
        run: mise install swiftlint
      - name: Run SwiftLint
        run: |
          # Avoid `mise run lint` which auto-installs ruby/tuist and fails on Linux
          mise exec -- swiftlint lint --reporter github-actions-logging --config PiperApp/BuildScripts/Linting/SwiftLint/swiftlint.yml || \
          mise x swiftlint -- swiftlint lint --reporter github-actions-logging --config PiperApp/BuildScripts/Linting/SwiftLint/swiftlint.yml
