[tools]
tuist = "4.200.5"
swiftlint = "latest"
ruby = "3.3.11"

[settings]
ruby.compile = false

[tasks.install]
description = "Resolve and fetch SPM dependencies (Package.swift)"
run = "tuist install"

[tasks.generate]
description = "Generates Xcode project (run install first if deps changed)"
run = """
   tuist version
   tuist install
   tuist generate --no-open --verbose
"""

[tasks.edit]
description = "Generates xcode project"
run = """
   tuist edit
"""

[tasks.lint]
description = "Runs linters"
env = { SRCROOT = "{{config_root}}" }
usage = '''
flag "--reporter <reporter>" help="Reporter type" default="xcode" { choices "xcode" "github-actions-logging" }
flag "--fix" help="Attempt to fix lint issues"
'''
run = '''
./PiperApp/BuildScripts/Linting/SwiftLint/RunSwiftLint.sh ${usage_fix:+--fix} --reporter ${usage_reporter}
'''

[tasks.build]
description = "Build for Simulator (default) or Device with a build number"
usage = '''
arg "<build_number>" help="The CI build number"
arg "[target]" help="Build target" default="ios-simulator" { choices "ios-simulator" "ios-device" "macos-device" }
'''
run = '''
# usage_target defaults to "ios-simulator"
# usage_build_number is the second positional argument

case "$usage_target" in
  "ios-device")
    ./PiperApp/BuildScripts/Scripts/BuildApp.sh "$usage_build_number" iOS
    ;;
  "macos-device")
    ./PiperApp/BuildScripts/Scripts/BuildApp.sh "$usage_build_number" macOS
    ;;
  *)
    ./PiperApp/BuildScripts/Scripts/BuildSimulator.sh "$usage_build_number"
    ;;
esac
'''

[tasks.test]
description = "Run PiperTests on a specified platform"
usage = '''
arg "[target]" help="Test target" default="macos" { choices "ios-simulator" "macos" "macos-device" }
'''
run = '''
DESTINATION=""
case "$usage_target" in
  "ios-simulator")
    # CI on macos-26 may not have iPhone 17 runtime preinstalled; try to find any available iPhone sim,
    # otherwise fall back to placeholder / macOS so pure-Swift PiperTests still run.
    if xcrun simctl list devices available 2>/dev/null | grep -q "iPhone 17"; then
      DESTINATION="platform=iOS Simulator,name=iPhone 17,OS=latest"
    elif xcrun simctl list devices available 2>/dev/null | grep -q "iPhone"; then
      IPHONE_NAME=$(xcrun simctl list devices available | grep "iPhone" | head -1 | sed -E 's/.*\(.*\) *\(.*\) *//; s/ *\(.*//; s/^[[:space:]]*//')
      # simctl output format: "iPhone 16 (UUID) (Shutdown)" - extract first token before " ("
      IPHONE_NAME=$(xcrun simctl list devices available | grep -o "iPhone[^()]*" | head -1 | xargs)
      if [ -n "$IPHONE_NAME" ]; then
        DESTINATION="platform=iOS Simulator,name=$IPHONE_NAME,OS=latest"
      else
        DESTINATION="platform=iOS Simulator,name=Any iOS Simulator Device"
      fi
    else
      # No iOS runtime installed - run tests on macOS instead (PiperTests are host-compatible)
      echo "No iOS simulator runtime available, falling back to macOS for tests"
      DESTINATION="platform=macOS"
    fi
    ;;
  "macos-device" | "macos")
    DESTINATION="platform=macOS"
    ;;
  *)
    DESTINATION="platform=macOS"
    ;;
esac

echo "Testing with destination: $DESTINATION"
xcodebuild test -workspace Piper.xcworkspace \
                -scheme Piper \
                -destination "$DESTINATION" \
                -only-testing:PiperTests \
                CODE_SIGNING_ALLOWED=NO
'''

[tasks.update-release-notes]
description = "Updates 'What's New' in App Store Connect using the version from version.xcconfig"
usage = '''
flag "--api-key-path <path>" help="Path to the App Store Connect API Key JSON file" default="fastlane/apikey.json"
flag "--skip-preview" help="Skip generating a preview before submission" default="false"
'''
run = '''
set -e
source PiperApp/BuildScripts/Configs/version.xcconfig
source PiperApp/BuildScripts/Configs/app_bundle_id.xcconfig

bundle exec fastlane swift init
bundle exec fastlane swift generate

bundle exec fastlane updateReleaseNotes appVersion:"$MARKETING_VERSION" \
                                        appIdentifier:"$APP_BUNDLE_IDENTIFIER" \
                                        apiKeyPath:"${usage_api_key_path}" \
                                        skipPreview:${usage_skip_preview}
'''

[tasks.setup]
description = "Install project dependencies"
depends = ["install"]
run = """
bundle config set path vendor/bundle
bundle install
"""

[tasks.screenshots-ios]
description = "Capture iOS screenshots"
run = "bundle exec fastlane captureScreenshots"

[tasks.screenshots-macos]
description = "Capture macOS screenshots"
run = "bash PiperApp/BuildScripts/Scripts/CaptureMacosScreenshots.sh"

[tasks.screenshots]
description = "Capture iOS + macOS screenshots"
run = "mise run screenshots-ios && mise run screenshots-macos"

[tasks.screenshots-upload]
description = "Upload screenshots to App Store Connect"
usage = '''
flag "--api-key-path <path>" help="Path to the App Store Connect API Key JSON file" default="fastlane/apikey.json"
flag "--platform <platform>" help="Platform to upload: ios, osx, or all" default="all" { choices "ios" "osx" "all" }
'''
run = '''
set -e
source PiperApp/BuildScripts/Configs/version.xcconfig
source PiperApp/BuildScripts/Configs/app_bundle_id.xcconfig
bundle exec fastlane updateReleaseNotes appVersion:"$MARKETING_VERSION" appIdentifier:"$APP_BUNDLE_IDENTIFIER" apiKeyPath:"${usage_api_key_path}" platform:${usage_platform} uploadScreenshots:true skipPreview:true
'''
